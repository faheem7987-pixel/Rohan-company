<script>
    (function(document, window) {
        var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (standalone) {
            document.addEventListener('click', function(e) {
                var target = e.target;
                while (target && target.nodeName !== 'A' && target.nodeName !== 'HTML') {
                    target = target.parentNode;
                }
                if (target && target.nodeName === 'A') {
                    var href = target.getAttribute('href');
                    if (href && !href.startsWith('http') && !href.startsWith('javascript:') && href !== '#') {
                        e.preventDefault();
                        window.location.href = href;
                    }
                }
            }, true);
        }
    })(document, window);
</script>

        tr.hl-yellow, tr.hl-yellow td { background-color: #fef08a !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        tr.hl-blue, tr.hl-blue td { background-color: #bae6fd !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        tr.hl-red, tr.hl-red td { background-color: #fecaca !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

        .footer-summary { 
            display: flex !important; 
            flex-direction: row !important; 
            justify-content: space-between !important; 
            width: 100% !important; 
            gap: 8px !important; 
            padding: 6px 0 !important; 
            margin-top: 10px !important; 
            margin-bottom: 8px !important; 
            border: none !important; 
            background: transparent !important; 
            page-break-inside: avoid !important; 
            break-inside: avoid !important;
            order: 99 !important; 
        }
        .summary-column { 
            flex: 1 !important; 
            background: #ffffff !important; 
            border: 1px solid #000000 !important; 
            padding: 5px !important; 
        }
        .summary-column h3 { 
            color: #000000 !important; 
            border-bottom: 1px solid #000000 !important; 
            font-size: 11px !important; 
            margin-bottom: 4px !important; 
        }
        .summary-item { 
            font-size: 10px !important; 
            color: #000000 !important; 
        }
        .summary-item:last-child {
            margin-top: 4px !important;
            padding-top: 4px !important;
            border-top: 1px solid #000000 !important;
        }
        .summary-item:last-child span:first-child {
            font-size: 12px !important;
            font-weight: 900 !important;
            color: #000000 !important;
        }
        .summary-item:last-child span:last-child {
            font-weight: 900 !important;
            font-size: 15.5px !important;
            display: inline-block !important;
        }
        .summary-item:last-child span:last-child.col-jama { color: #1e7e34 !important; }
        .summary-item:last-child span:last-child.col-bnam { color: #bd2130 !important; }
    }
</style>
</head>
<body>

    <div class="ledger-container" id="mainLedgerContainer">

        <div class="header-section" id="ledgerHeaderSection">
            <button onclick="triggerLedgerPrint()" class="btn-print" id="btnLedgerPrint">پرنٹ 🖨️</button>
            <h1 class="customer-title" id="ledgerCustomerTitle">👤 لوڈنگ...</h1>
            <button onclick="goBackSmartly()" class="btn-back" id="btnLedgerBack">واپس 🔙</button>
        </div>

        <div class="controls-wrapper" id="ledgerControlsWrapper">
            <div class="search-wrapper">
                <input type="text" id="ledgerSearchInput" class="search-input" placeholder="🔍 کھاتہ میں تلاش کریں...">
            </div>

            <div class="pen-toolbar" id="penToolbarBox">
                <span id="lblPenToolbar" style="font-size:12px; font-weight:bold; color:#ffc107; margin-left:4px;">ہائی لائٹر پین:</span>
                <button type="button" class="pen-btn pen-yellow" id="penBtnYellow" onclick="setHighlighterPen('yellow')">🖊 پیلا</button>
                <button type="button" class="pen-btn pen-blue" id="penBtnBlue" onclick="setHighlighterPen('blue')">🖊️ نیلا</button>
                <button type="button" class="pen-btn pen-red" id="penBtnRed" onclick="setHighlighterPen('red')">🖊️ سرخ</button>
                <button type="button" class="pen-btn pen-eraser" id="penBtnEraser" onclick="setHighlighterPen('')">❌ ختم</button>
            </div>
        </div>

        <div class="footer-summary" id="footerSummaryBox">
            <div class="summary-column jama-border" id="colSumPcs">
                <h3 id="lblH3Pcs">📦 پیس (کارٹن) کا حساب</h3>
                <div class="summary-item"><span id="lblSumBnamPcs">کل بنام پیس:</span><span class="col-bnam" id="fBnamPcs">0</span></div>
                <div class="summary-item"><span id="lblSumJamaPcs">کل جمع پیس:</span><span class="col-jama" id="fJamaPcs">0</span></div>
                <div class="summary-item"><span id="lbl-cartons-total">ٹوٹل:</span><span id="final-cartons-total">0</span></div>
            </div>

            <div class="summary-column bnam-border" id="colSumWeight">
                <h3 id="lblH3Weight">⚖️ وزن کا حساب</h3>
                <div class="summary-item"><span id="lblSumBnamW">کل بنام وزن:</span><span class="col-bnam" id="fBnamW">0.00</span></div>
                <div class="summary-item"><span id="lblSumJamaW">کل جمع وزن:</span><span class="col-jama" id="fJamaW">0.00</span></div>
                <div class="summary-item"><span id="lbl-weight-total">ٹوٹل:</span><span id="final-weight-total">0.00</span></div>
            </div>

            <div class="summary-column" id="colSumCash">
                <h3 id="lblH3Cash">💰 رقم کا حساب</h3>
                <div class="summary-item"><span id="lblSumBnamCash">کل بنام رقم:</span><span class="col-bnam" id="fBnamCash">0</span></div>
                <div class="summary-item"><span id="lblSumJamaCash">کل جمع رقم:</span><span class="col-jama" id="fJamaCash">0</span></div>
                <div class="summary-item"><span id="lbl-money-total">ٹوٹل:</span><span id="final-money-total">0</span></div>
            </div>
        </div>

        <div class="shared-scroll-wrapper" id="ledgerTablesContainer">
            <div class="shared-inner-content">
                
                <table id="ledgerTable">
                    <thead id="ledgerThead">
                        <tr class="print-repeat-row">
                            <th colspan="2" class="print-head-cell print-meta-left" id="printLedgerDateTime"></th>
                            <th id="printCenterTh" colspan="5" class="print-head-cell print-title-center">
                                <span id="printHeaderTitleCell"></span>
                            </th>
                            <th colspan="2" class="print-head-cell print-logo-box-right">
                                <img src="logo.png" alt="Logo" class="print-logo-img" onerror="this.style.display='none'">
                            </th>
                        </tr>
                        <tr class="table-columns-header">
                            <th class="col-date" id="thDate">تاریخ</th>
                            <th class="col-details" id="thDetails">تفصیل</th>
                            <th class="col-extra" id="thExtra" style="display: none;">اضافی</th>
                            <th class="col-pcs" id="thPcs">پیس</th>
                            <th class="col-weight" id="thWeight">وزن</th>
                            <th class="col-rate" id="thRate">ریٹ</th>
                            <th class="col-amount col-bnam" id="thBnam">بنام رقم</th>
                            <th class="col-amount col-jama" id="thJama">جمع رقم</th>
                            <th class="col-amount col-balance" id="thBalance">ٹوٹل بیلنس</th>
                            <th id="actionHeaderCol" class="edit-th">ایڈٹ</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerTbody"></tbody>
                </table>

            </div>
        </div>

        <div class="danger-zone" id="dangerZoneContainer">
            <button id="btnRestoreAccount" onclick="handleAccountRestore()" class="btn-restore-account">کھاتہ بحال کریں 🔄 (Restore)</button>
            <button id="btnMainDeleteAccount" onclick="handleAccountDeletion()" class="btn-delete-account">پورا کھاتہ ڈیلیٹ کریں (ریکارڈ محفوظ ہوگا) 🚨</button>
        </div>
    </div>

    <script>
        function applySavedTheme() {
            let savedTheme = localStorage.getItem('rohan_theme_mode') || 'dark';
            let themeMeta = document.querySelector('meta[name="theme-color"]');

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#f3f4f6');
            } else {
                document.body.classList.remove('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#080808');
            }
        }
        applySavedTheme();

        let currentCustomer = localStorage.getItem('active_ledger_customer') || "وقاص";
        let activeBranchId = localStorage.getItem('active_branch_id') || 'branch_1';
        let activeBranchName = (localStorage.getItem('active_branch_name') || 'ڈرائی فروٹ ہاؤس').trim();
        let userRole = sessionStorage.getItem('rohan_user_role') || 'admin';

        let branchOverrides = JSON.parse(localStorage.getItem('rohan_branch_lang_overrides')) || {};
        let globalLang = localStorage.getItem('rohan_global_lang') || 'ur';
        let activeBranchLang = localStorage.getItem('active_branch_lang') || branchOverrides[activeBranchId] || globalLang;
        let isEn = (activeBranchLang === 'en');

        let customerKey = activeBranchId + '_customer_list';
        let bnamRecordsKey = activeBranchId + '_bnam_records';
        let detailsKey = activeBranchId + '_customer_details';
        let deletedKey = activeBranchId + '_deleted_customers';

        let masterSettings = JSON.parse(localStorage.getItem(`rohan_branch_master_settings_${activeBranchId}`)) || {
            cols: {
                pcs: { visible: true, name: 'پیس' },
                weight: { visible: true, name: 'وزن' },
                rate: { visible: true, name: 'ریٹ' },
                amount: { name: 'کل رقم' },
                extra: { visible: false, name: 'اضافی کالم' }
            },
            ledgerBoxPos: 'bottom'
        };

        let showExtra = masterSettings.cols && masterSettings.cols.extra && masterSettings.cols.extra.visible === true;
        let extraColName = (masterSettings.cols && masterSettings.cols.extra && masterSettings.cols.extra.name) ? masterSettings.cols.extra.name : (isEn ? 'Extra' : 'اضافی');
        
        let showPcs = !masterSettings.cols || masterSettings.cols.pcs.visible !== false;
        let pcsCustomName = (masterSettings.cols && masterSettings.cols.pcs && masterSettings.cols.pcs.name) ? masterSettings.cols.pcs.name : (isEn ? 'Pcs' : 'پیس');
        
        let showWeight = !masterSettings.cols || masterSettings.cols.weight.visible !== false;
        let weightCustomName = (masterSettings.cols && masterSettings.cols.weight && masterSettings.cols.weight.name) ? masterSettings.cols.weight.name : (isEn ? 'Weight' : 'وزن');
        
        let showRate = !masterSettings.cols || masterSettings.cols.rate.visible !== false;
        let rateCustomName = (masterSettings.cols && masterSettings.cols.rate && masterSettings.cols.rate.name) ? masterSettings.cols.rate.name : (isEn ? 'Rate' : 'ریٹ');

        let amountCustomName = (masterSettings.cols && masterSettings.cols.amount && masterSettings.cols.amount.name) ? masterSettings.cols.amount.name : '';

        document.getElementById('thExtra').style.display = showExtra ? '' : 'none';
        document.getElementById('thPcs').style.display = showPcs ? '' : 'none';
        document.getElementById('thWeight').style.display = showWeight ? '' : 'none';
        document.getElementById('thRate').style.display = showRate ? '' : 'none';

        document.getElementById('colSumPcs').style.display = showPcs ? '' : 'none';
        document.getElementById('colSumWeight').style.display = showWeight ? '' : 'none';

        function applyLedgerBoxPlacement() {
            let summaryBox = document.getElementById('footerSummaryBox');
            let controlsWrapper = document.getElementById('ledgerControlsWrapper');
            let dangerZone = document.getElementById('dangerZoneContainer');

            if (masterSettings.ledgerBoxPos === 'top_search') {
                if (controlsWrapper && summaryBox) {
                    controlsWrapper.insertAdjacentElement('afterend', summaryBox);
                }
            } else {
                if (dangerZone && summaryBox) {
                    dangerZone.insertAdjacentElement('beforebegin', summaryBox);
                }
            }
        }
        applyLedgerBoxPlacement();

        let customerDetails = JSON.parse(localStorage.getItem(detailsKey)) || [];
        let custInfo = null;
        for (let i = customerDetails.length - 1; i >= 0; i--) {
            if (customerDetails[i].name && customerDetails[i].name.toLowerCase() === currentCustomer.toLowerCase()) {
                custInfo = customerDetails[i];
                break;
            }
        }
        let currentAccountNo = (custInfo && custInfo.accountNo) ? custInfo.accountNo : '';
        
        if (isEn) {
            document.body.classList.add('lang-en');
            document.documentElement.lang = 'en';
            document.title = `Customer Ledger - ${currentCustomer}`;

            document.getElementById('btnLedgerPrint').innerText = 'Print 🖨️';
            document.getElementById('btnLedgerBack').innerText = 'Back 🔙';
            document.getElementById('ledgerSearchInput').placeholder = '🔍 Search in ledger...';

            let penToolbarLabel = document.getElementById('lblPenToolbar');
            if (penToolbarLabel) penToolbarLabel.innerText = 'Highlighter Pen:';
            document.getElementById('penBtnYellow').innerText = '🖊 Yellow';
            document.getElementById('penBtnBlue').innerText = '🖊️ Blue';
            document.getElementById('penBtnRed').innerText = '🖊️ Red';
            document.getElementById('penBtnEraser').innerText = '❌ Clear';

            document.getElementById('thDate').innerText = 'Date';
            document.getElementById('thDetails').innerText = 'Description';
            document.getElementById('thExtra').innerText = extraColName;
            document.getElementById('thPcs').innerText = pcsCustomName;
            document.getElementById('thWeight').innerText = weightCustomName;
            document.getElementById('thRate').innerText = rateCustomName;
            document.getElementById('thBnam').innerText = amountCustomName ? `${amountCustomName} (Dr)` : 'Debit Amount';
            document.getElementById('thJama').innerText = amountCustomName ? `${amountCustomName} (Cr)` : 'Credit Amount';
            document.getElementById('thBalance').innerText = 'Total Balance';
            if (document.getElementById('actionHeaderCol')) document.getElementById('actionHeaderCol').innerText = 'Edit';

            document.getElementById('lblH3Pcs').innerText = `📦 ${pcsCustomName} Summary`;
            document.getElementById('lblSumBnamPcs').innerText = `Total Debit ${pcsCustomName}:`;
            document.getElementById('lblSumJamaPcs').innerText = `Total Credit ${pcsCustomName}:`;

            document.getElementById('lblH3Weight').innerText = `⚖️ ${weightCustomName} Summary`;
            document.getElementById('lblSumBnamW').innerText = `Total Debit ${weightCustomName}:`;
            document.getElementById('lblSumJamaW').innerText = `Total Credit ${weightCustomName}:`;

            document.getElementById('lblH3Cash').innerText = amountCustomName ? `💰 ${amountCustomName} Summary` : '💰 Amount Summary';
            document.getElementById('lblSumBnamCash').innerText = amountCustomName ? `Total Debit ${amountCustomName}:` : 'Total Debit Amount:';
            document.getElementById('lblSumJamaCash').innerText = amountCustomName ? `Total Credit ${amountCustomName}:` : 'Total Credit Amount:';
        } else {
            document.body.classList.remove('lang-en');
            document.documentElement.lang = 'ur';
            document.title = `لیجر کھاتہ - ${currentCustomer}`;

            document.getElementById('thExtra').innerText = extraColName;
            document.getElementById('thPcs').innerText = pcsCustomName;
            document.getElementById('thWeight').innerText = weightCustomName;
            document.getElementById('thRate').innerText = rateCustomName;

            if (amountCustomName) {
                document.getElementById('thBnam').innerText = `${amountCustomName} (بنام)`;
                document.getElementById('thJama').innerText = `${amountCustomName} (جمع)`;
            }

            document.getElementById('lblH3Pcs').innerText = `📦 ${pcsCustomName} کا حساب`;
            document.getElementById('lblSumBnamPcs').innerText = `کل بنام ${pcsCustomName}:`;
            document.getElementById('lblSumJamaPcs').innerText = `کل جمع ${pcsCustomName}:`;

            document.getElementById('lblH3Weight').innerText = `⚖️ ${weightCustomName} کا حساب`;
            document.getElementById('lblSumBnamW').innerText = `کل بنام ${weightCustomName}:`;
            document.getElementById('lblSumJamaW').innerText = `کل جمع ${weightCustomName}:`;

            if (amountCustomName) {
                document.getElementById('lblH3Cash').innerText = `💰 ${amountCustomName} کا حساب`;
                document.getElementById('lblSumBnamCash').innerText = `کل بنام ${amountCustomName}:`;
                document.getElementById('lblSumJamaCash').innerText = `کل جمع ${amountCustomName}:`;
            }
        }

        let accBadgeHtml = currentAccountNo ? `<span class="acc-no-badge">(${isEn ? 'Account No.' : 'کھاتہ نمبر'} ${currentAccountNo})</span>` : '';
        let printAccBadgeHtml = currentAccountNo ? `<span class="print-acc-badge">(${isEn ? 'Account No.' : 'کھاتہ نمبر'} ${currentAccountNo})</span>` : '';

        let fullTitleHtml = `${accBadgeHtml} 👤 ${currentCustomer} <span class="branch-sub-tag">(${activeBranchName})</span>`;
        document.getElementById('ledgerCustomerTitle').innerHTML = fullTitleHtml;
        
        document.getElementById('printHeaderTitleCell').innerHTML = `${printAccBadgeHtml} 👤 ${currentCustomer} <span class="print-branch">(${activeBranchName})</span>`;

        let savedBranchesConfig = localStorage.getItem('rohan_branches_custom_config_v2');
        if (savedBranchesConfig) {
            try {
                let branches = JSON.parse(savedBranchesConfig);
                let currentBranch = branches.find(b => b.id === activeBranchId);
                if (currentBranch && currentBranch.color1) {
                    let primaryColor = currentBranch.color1;
                    
                    let container = document.getElementById('mainLedgerContainer');
                    container.style.borderColor = primaryColor;
                    container.style.boxShadow = `0 4px 18px ${primaryColor}35`;

                    let headSec = document.getElementById('ledgerHeaderSection');
                    if (headSec) headSec.style.borderBottomColor = primaryColor;

                    let printBtn = document.getElementById('btnLedgerPrint');
                    if (printBtn) printBtn.style.backgroundColor = primaryColor;

                    let searchInp = document.getElementById('ledgerSearchInput');
                    if (searchInp) {
                        searchInp.addEventListener('focus', function() { this.style.borderColor = primaryColor; });
                        searchInp.addEventListener('blur', function() { this.style.borderColor = '#333'; });
                    }
                }
            } catch(e){}
        }

        function updateLedgerPrintMeta() {
            let now = new Date();
            let d = String(now.getDate()).padStart(2, '0');
            let m = String(now.getMonth() + 1).padStart(2, '0');
            let y = now.getFullYear();
            
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            let timeStr = `${hours}:${minutes} ${ampm}`;

            let dtBox = document.getElementById('printLedgerDateTime');
            if (dtBox) {
                dtBox.innerHTML = `Date: ${d}/${m}/${y}<br>Time: ${timeStr}`;
            }
        }

        function triggerLedgerPrint() {
            updateLedgerPrintMeta();
            window.print();
        }

        window.onbeforeprint = updateLedgerPrintMeta;

        let allRenderedRecords = [];
        let activeHighlighterColor = null;

        window.setHighlighterPen = function(color) {
            if (userRole === 'owner') return;

            if (activeHighlighterColor === color) {
                activeHighlighterColor = null;
            } else {
                activeHighlighterColor = color;
            }
            updatePenButtonsUI();
        };

        function updatePenButtonsUI() {
            document.querySelectorAll('.pen-btn').forEach(btn => btn.classList.remove('active-pen'));
            if (activeHighlighterColor === 'yellow') {
                document.getElementById('penBtnYellow').classList.add('active-pen');
            } else if (activeHighlighterColor === 'blue') {
                document.getElementById('penBtnBlue').classList.add('active-pen');
            } else if (activeHighlighterColor === 'red') {
                document.getElementById('penBtnRed').classList.add('active-pen');
            } else if (activeHighlighterColor === '') {
                document.getElementById('penBtnEraser').classList.add('active-pen');
            }
        }

        window.handleRowHighlightClick = function(rowElement, localIdx) {
            if (activeHighlighterColor === null) return;
            if (userRole === 'owner') return;

            let bnamRecords = JSON.parse(localStorage.getItem(bnamRecordsKey)) || [];
            let customerRecordsWithIndices = [];
            
            bnamRecords.forEach((r, i) => { 
                if(r.customerName === currentCustomer) {
                    customerRecordsWithIndices.push(i);
                } 
            });
            
            let globalIndex = customerRecordsWithIndices[localIdx];
            if (globalIndex === undefined || globalIndex === null) return;

            rowElement.classList.remove('hl-yellow', 'hl-blue', 'hl-red');
            if (activeHighlighterColor) {
                rowElement.classList.add(`hl-${activeHighlighterColor}`);
            }

            bnamRecords[globalIndex].highlightColor = activeHighlighterColor;
            localStorage.setItem(bnamRecordsKey, JSON.stringify(bnamRecords));
        };

        function goBackSmartly() {
            let backTarget = localStorage.getItem('ledger_back_target') || './summary.html';
            localStorage.removeItem('ledger_back_target');
            window.location.href = backTarget;
        }

        function isAlreadyInDeletedRecords() {
            let deletedCustomers = JSON.parse(localStorage.getItem(deletedKey)) || [];
            return deletedCustomers.some(d => (typeof d === 'object' ? d.name : d).toLowerCase() === currentCustomer.toLowerCase());
        }

        function setupDeleteButtonUI() {
            let delBtn = document.getElementById('btnMainDeleteAccount');
            let restoreBtn = document.getElementById('btnRestoreAccount');
            if (!delBtn) return;

            if (isAlreadyInDeletedRecords()) {
                delBtn.innerText = isEn ? "⚠️ Permanently Delete Account" : "⚠️ کھاتہ مکمل ختم کریں (Permanent Delete)";
                delBtn.style.backgroundColor = "#7f1d1d";
                if (restoreBtn) {
                    restoreBtn.style.display = "inline-block";
                    restoreBtn.innerText = isEn ? "Restore Account 🔄" : "کھاتہ بحال کریں 🔄 (Restore)";
                }
            } else {
                delBtn.innerText = isEn ? "Delete Full Account (Data Preserved) 🚨" : "پورا کھاتہ ڈیلیٹ کریں (ریکارڈ محفوظ ہوگا) 🚨";
                delBtn.style.backgroundColor = "#bd2130";
                if (restoreBtn) restoreBtn.style.display = "none";
            }
        }

        window.handleAccountRestore = function() {
            if (userRole === 'owner') {
                alert(isEn ? "⚠️ You are not authorized to restore an account!" : "⚠️ آپ کے پاس کھاتہ بحال کرنے کی اجازت نہیں ہے!");
                return;
            }

            let confirmText = isEn 
                ? `🔄 Are you sure you want to restore "${currentCustomer}" back to the active ledger and summary?` 
                : `🔄 کیا آپ واقعی "${currentCustomer}" کا کھاتہ دوبارہ بحال کر کے مین سسٹم اور سمری میں واپس لانا چاہتے ہیں؟`;

            if (confirm(confirmText)) {
                let customers = JSON.parse(localStorage.getItem(customerKey)) || [];
                let deletedCustomers = JSON.parse(localStorage.getItem(deletedKey)) || [];

                deletedCustomers = deletedCustomers.filter(d => (typeof d === 'object' ? d.name : d).toLowerCase() !== currentCustomer.toLowerCase());
                localStorage.setItem(deletedKey, JSON.stringify(deletedCustomers));

                if (!customers.some(c => c.toLowerCase() === currentCustomer.toLowerCase())) {
                    customers.push(currentCustomer);
                    localStorage.setItem(customerKey, JSON.stringify(customers));
                }

                alert(isEn ? `✅ Account "${currentCustomer}" restored successfully!` : `✅ گاہک "${currentCustomer}" کا کھاتہ کامیابی سے بحال ہو گیا ہے!`);
                window.location.href = './summary.html';
            }
        };

        function getVisibleColumnCount() {
            let count = 5;
            if (showExtra) count++;
            if (showPcs) count++;
            if (showWeight) count++;
            if (showRate) count++;
            if (userRole !== 'owner') count++;
            return count;
        }

        function loadLedgerData() {
            let bnamRecords = JSON.parse(localStorage.getItem(bnamRecordsKey)) || [];
            let customerRecords = bnamRecords.filter(r => r.customerName === currentCustomer);

            const tbody = document.getElementById('ledgerTbody');
            tbody.innerHTML = '';
            allRenderedRecords = []; 

            let runningBalance = 0;
            let totalCols = getVisibleColumnCount();
            let centerTh = document.getElementById('printCenterTh');
            if (centerTh) {
                let centerColspan = totalCols - 4;
                centerTh.setAttribute('colspan', centerColspan > 1 ? centerColspan : 1);
            }

            if (customerRecords.length === 0) {
                let noDataMsg = isEn ? "No entry exists in this account yet!" : "اس کھاتے میں ابھی کوئی انٹری موجود نہیں ہے!";
                tbody.innerHTML = `<tr><td colspan="${totalCols}" style="color: #999; padding: 18px;">${noDataMsg}</td></tr>`;
                recalculateTotals(); 
                applyRolePermissions();
                setupDeleteButtonUI();
                return;
            }

            customerRecords.forEach((record, index) => {
                let amt = parseFloat(record.totalAmount) || 0;
                let w = parseFloat(record.weight) || 0;
                let p = parseInt(record.pcs) || 0;
                let extraVal = record.extra || "-";
                
                let isBnam = (record.type !== 'JAMA');

                let cashBnamRow = "-", cashJamaRow = "-";

                if (isBnam) {
                    cashBnamRow = amt;
                    runningBalance -= amt; 
                } else {
                    cashJamaRow = amt;
                    runningBalance += amt; 
                }

                allRenderedRecords.push({
                    pcs: p,
                    weight: w,
                    amount: amt,
                    isBnam: isBnam,
                    runningBalanceAtRow: runningBalance
                });

                let displayDate = record.date;
                if (record.date) {
                    let parts = record.date.includes('-') ? record.date.split('-') : record.date.split('/');
                    if (parts.length === 3) {
                        let y, m, d;
                        if (parts[0].length === 4) {
                            y = parts[0]; m = parts[1]; d = parts[2];
                        } else {
                            d = parts[0]; m = parts[1]; y = parts[2];
                        }
                        let shortYear = y.length >= 2 ? y.slice(-2) : y;
                        let shortMonth = parseInt(m, 10);
                        let shortDay = parseInt(d, 10);
                        displayDate = `${shortDay}/${shortMonth}/${shortYear}`;
                    }
                }

                let hlClass = record.highlightColor ? `hl-${record.highlightColor}` : '';

                let tr = document.createElement('tr');
                tr.className = `ledger-data-row ${hlClass}`; 
                tr.setAttribute('data-index', index); 
                
                tr.onclick = function(e) {
                    if (e.target.closest('.action-cell')) return;
                    handleRowHighlightClick(this, index);
                };

                let balSuffix = isEn ? (runningBalance >= 0 ? ' Cr' : ' Dr') : (runningBalance >= 0 ? ' ج' : ' ب');

                tr.innerHTML = `
                    <td class="col-date">${displayDate}</td>
                    <td class="col-details">${record.details || "-"}</td>
                    ${showExtra ? `<td class="col-extra">${extraVal}</td>` : ''}
                    ${showPcs ? `<td class="col-pcs ${isBnam ? 'col-bnam' : 'col-jama'}">${p || "0"}</td>` : ''}
                    ${showWeight ? `<td class="col-weight ${isBnam ? 'col-bnam' : 'col-jama'}">${w ? w.toFixed(2) : "0"}</td>` : ''}
                    ${showRate ? `<td class="col-rate">${record.rate || "-"}</td>` : ''}
                    <td class="col-amount col-bnam">${cashBnamRow !== "-" ? cashBnamRow.toLocaleString('en-US') : "-"}</td>
                    <td class="col-amount col-jama">${cashJamaRow !== "-" ? cashJamaRow.toLocaleString('en-US') : "-"}</td>
                    <td class="col-amount dynamic-balance ${runningBalance >= 0 ? 'col-jama' : 'col-bnam'}">
                        ${Math.abs(runningBalance).toLocaleString('en-US')} ${balSuffix}
                    </td>
                    <td class="action-cell">
                        <span class="btn-pen-edit" onclick="editSingleRecord(event, ${index})" title="${isEn ? 'Edit or Delete' : 'ترمیم یا ڈیلیٹ کریں'}">✏️</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            recalculateTotals();
            applyRolePermissions();
            setupDeleteButtonUI();
        }

        function applyRolePermissions() {
            if (userRole === 'owner') {
                const actionHeader = document.getElementById('actionHeaderCol');
                if (actionHeader) actionHeader.style.display = 'none';

                document.querySelectorAll('.action-cell').forEach(td => td.style.display = 'none');
                
                const dangerZone = document.getElementById('dangerZoneContainer');
                if (dangerZone) dangerZone.style.display = 'none';

                const penToolbar = document.getElementById('penToolbarBox');
                if (penToolbar) penToolbar.style.display = 'none';
            }
        }

        function recalculateTotals() {
            let bPcs = 0, jPcs = 0, bW = 0, jW = 0, bCash = 0, jCash = 0, finalBalance = 0;
            let visibleRows = document.querySelectorAll('#ledgerTable tbody tr.ledger-data-row');

            visibleRows.forEach(row => {
                if (row.style.display !== "none") {
                    let idx = parseInt(row.getAttribute('data-index'));
                    let data = allRenderedRecords[idx];
                    
                    if (data) {
                        if (data.isBnam) {
                            bPcs += data.pcs;
                            bW += data.weight;
                            bCash += data.amount;
                        } else {
                            jPcs += data.pcs;
                            jW += data.weight;
                            jCash += data.amount;
                        }
                    }
                }
            });

            finalBalance = jCash - bCash; 

            document.getElementById('fBnamPcs').innerText = bPcs;
            document.getElementById('fJamaPcs').innerText = jPcs;
            let netP = jPcs - bPcs;
            let lblPcsEl = document.getElementById('lbl-cartons-total');
            let finalPcsEl = document.getElementById('final-cartons-total');
            
            let pPrefix = isEn ? "Total " + (netP >= 0 ? "Cr:" : "Dr:") : "ٹوٹل " + (netP >= 0 ? "ج:" : "ب:");
            lblPcsEl.innerText = pPrefix;
            finalPcsEl.innerText = Math.abs(netP);
            finalPcsEl.className = netP >= 0 ? "col-jama" : "col-bnam";

            document.getElementById('fBnamW').innerText = bW.toFixed(2);
            document.getElementById('fJamaW').innerText = jW.toFixed(2);
            let netW = jW - bW;
            let lblWeightEl = document.getElementById('lbl-weight-total');
            let finalWeightEl = document.getElementById('final-weight-total');
            
            let wPrefix = isEn ? "Total " + (netW >= 0 ? "Cr:" : "Dr:") : "ٹوٹل " + (netW >= 0 ? "ج:" : "ب:");
            lblWeightEl.innerText = wPrefix;
            finalWeightEl.innerText = Math.abs(netW).toFixed(2);
            finalWeightEl.className = netW >= 0 ? "col-jama" : "col-bnam";

            document.getElementById('fBnamCash').innerText = bCash.toLocaleString('en-US');
            document.getElementById('fJamaCash').innerText = jCash.toLocaleString('en-US');
            let lblMoneyEl = document.getElementById('lbl-money-total');
            let finalMoneyEl = document.getElementById('final-money-total');
            
            let mPrefix = isEn ? "Total " + (finalBalance >= 0 ? "Cr:" : "Dr:") : "ٹوٹل " + (finalBalance >= 0 ? "ج:" : "ب:");
            lblMoneyEl.innerText = mPrefix;
            finalMoneyEl.innerText = Math.abs(finalBalance).toLocaleString('en-US');
            finalMoneyEl.className = finalBalance >= 0 ? "col-jama" : "col-bnam";
        }

        window.editSingleRecord = function(event, idx) {
            if (event) event.stopPropagation();
            if (userRole === 'owner') {
                alert(isEn ? "⚠️ You are not authorized to edit or delete entries!" : "⚠️ آپ کے پاس انٹری ایڈٹ یا ڈیلیٹ کرنے کی اجازت نہیں ہے!");
                return;
            }
            let bnamRecords = JSON.parse(localStorage.getItem(bnamRecordsKey)) || [];
            let customerRecordsWithIndices = [];
            
            bnamRecords.forEach((r, i) => { 
                if(r.customerName === currentCustomer) {
                    customerRecordsWithIndices.push(i);
                } 
            });
            
            let globalIndex = customerRecordsWithIndices[idx];
            
            if (globalIndex !== undefined && globalIndex !== null) {
                localStorage.setItem('edit_record_index', globalIndex); 
                window.location.href = './edit_entry.html'; 
            } else {
                alert(isEn ? "Entry not found!" : "انٹری نہیں ملی!");
            }
        };

        window.handleAccountDeletion = function() {
            if (userRole === 'owner') {
                alert(isEn ? "⚠️ You are not authorized to delete accounts!" : "⚠️ آپ کے پاس کھاتہ ڈیلیٹ کرنے کی اجازت نہیں ہے!");
                return;
            }

            if (isAlreadyInDeletedRecords()) {
                let permConfirm = isEn
                    ? `🚨 Are you sure you want to permanently delete "${currentCustomer}" and all associated entries?\nThis data cannot be recovered!`
                    : `🚨 کیا آپ واقعی "${currentCustomer}" کا کھاتہ اور اس کی تمام سابقہ انٹریز سسٹم سے ہمیشہ کے لیے ختم کرنا چاہتے ہیں؟\nیہ ریکارڈ دوبارہ کبھی واپس نہیں آ سکے گا!`;

                if (confirm(permConfirm)) {
                    let deletedCustomers = JSON.parse(localStorage.getItem(deletedKey)) || [];
                    deletedCustomers = deletedCustomers.filter(d => (typeof d === 'object' ? d.name : d).toLowerCase() !== currentCustomer.toLowerCase());
                    localStorage.setItem(deletedKey, JSON.stringify(deletedCustomers));

                    let bnamRecords = JSON.parse(localStorage.getItem(bnamRecordsKey)) || [];
                    bnamRecords = bnamRecords.filter(r => r.customerName.toLowerCase() !== currentCustomer.toLowerCase());
                    localStorage.setItem(bnamRecordsKey, JSON.stringify(bnamRecords));

                    let customerDetails = JSON.parse(localStorage.getItem(detailsKey)) || [];
                    customerDetails = customerDetails.filter(c => c.name.toLowerCase() !== currentCustomer.toLowerCase());
                    localStorage.setItem(detailsKey, JSON.stringify(customerDetails));

                    localStorage.removeItem('active_ledger_customer');
                    alert(isEn ? `✅ Account "${currentCustomer}" permanently deleted!` : `✅ گاہک "${currentCustomer}" کا پورا کھاتہ اور ریکارڈ مستقل طور پر ختم کر دیا گیا ہے!`);
                    window.location.href = './deleted_records.html';
                }
            } else {
                let delConfirm = isEn
                    ? "🚨 Are you sure you want to delete this account and move it to 'Deleted Records'?"
                    : "🚨 کیا آپ واقعی یہ کھاتہ ڈیلیٹ کر کے 'Deleted Records' پینل میں منتقل کرنا چاہتے ہیں؟";

                if (confirm(delConfirm)) {
                    let customers = JSON.parse(localStorage.getItem(customerKey)) || [];
                    let deletedCustomers = JSON.parse(localStorage.getItem(deletedKey)) || [];

                    let today = new Date();
                    let day = String(today.getDate()).padStart(2, '0');
                    let month = String(today.getMonth() + 1).padStart(2, '0');
                    let year = today.getFullYear();
                    let deleteDate = `${day}/${month}/${year}`;

                    customers = customers.filter(c => c.toLowerCase() !== currentCustomer.toLowerCase());
                    localStorage.setItem(customerKey, JSON.stringify(customers));

                    let alreadyExists = deletedCustomers.some(d => (typeof d === 'object' ? d.name : d).toLowerCase() === currentCustomer.toLowerCase());
                    if (!alreadyExists) {
                        deletedCustomers.push({ name: currentCustomer, date: deleteDate });
                        localStorage.setItem(deletedKey, JSON.stringify(deletedCustomers));
                    }

                    alert(isEn ? "✅ Account successfully moved to 'Deleted Records'!" : "✅ کھاتہ کامیابی سے حذف ہو کر 'Deleted Records' پینل میں منتقل کر دیا گیا ہے!");
                    window.location.href = './summary.html';
                }
            }
        };

        document.getElementById('ledgerSearchInput').addEventListener('input', function() {
            let filter = this.value.toLowerCase().replace(/,/g, '').trim();
            document.querySelectorAll('#ledgerTable tbody tr.ledger-data-row').forEach(row => {
                let rowText = row.innerText.toLowerCase().replace(/,/g, '');
                row.style.display = rowText.includes(filter) ? "" : "none";
            });
            recalculateTotals();
        });

        loadLedgerData();
    </script>
</body>
</html>
