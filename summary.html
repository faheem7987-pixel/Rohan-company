<script>
    (function(document, window) {
        var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (standalone) {
            document.addEventListener('click', function(e) {
                var target = e.target;
                while (target && target.nodeName !== 'A' && target.nodeName !== 'HTML') {
                    target = target.parentNode;
                }
                if (target && target.nodeName === 'A') {
                    var href = target.getAttribute('href');
                    if (href && !href.startsWith('http') && !href.startsWith('javascript:') && href !== '#') {
                        e.preventDefault();
                        window.location.href = href;
                    }
                }
            }, true);
        }
    })(document, window);
</script>

<body>

    <div class="container" id="mainSummaryContainer">
        <div class="print-meta-info" id="printMetaStamp"></div>

        <div class="top-header" id="summaryTopHeader">
            <!-- ⚡ پرنٹ میں اوپر دائیں جانب ظاہر ہونے والا لوگو -->
            <img src="logo.png" alt="Logo" class="print-logo-top-right" onerror="this.style.display='none'">

            <button onclick="triggerPrintWithMeta()" class="btn-header btn-print" id="btnPrintSummary">🖨️ پرنٹ</button>
            <div class="main-title" id="summaryHeaderWrapper">
                <span id="summaryMainTitle">روکڑ سمری</span>
                <span id="headerBranchName" class="branch-mini-name">لوڈنگ...</span>
            </div>
            <a href="./home.html" class="btn-back btn-header" id="btnBackHome">🔙 واپس</a>
        </div>

        <div class="filter-panel" id="summaryFilterPanel">
            <div class="search-wrapper">
                <label class="date-label" id="lblSearch">🔎 نام، کھاتہ نمبر یا رقم تلاش کریں:</label>
                <input type="text" id="summarySearchInput" class="search-input" placeholder="🔍 نام، کھاتہ نمبر یا رقم لکھیں...">
            </div>
            <div class="date-wrapper">
                <label class="date-label" id="lblDateFilter">📅 تاریخ کا فلٹر لگائیں:</label>
                <input type="date" id="summaryDateFilter" class="date-input" onchange="loadSummaryData()">
            </div>
        </div>
        
        <div class="tables-container" id="summaryTablesContainer">
            <div class="table-wrapper">
                <div class="table-title color-jama" id="titleTableJama">🟢 جمع کھاتے (Creditors)</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 63%;" class="text-right" id="thCustJama">گاہک / تفصیل</th>
                            <th style="width: 31%;" id="thAmtJama">جمع رقم</th>
                            <th style="width: 6%;" class="col-action-th" id="thActionJama">ایکشن</th>
                        </tr>
                    </thead>
                    <tbody id="jama_tbody"></tbody>
                </table>
            </div>

            <div class="table-wrapper">
                <div class="table-title color-bnam" id="titleTableBnam">🟠 بنام کھاتے (Debitors)</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 63%;" class="text-right" id="thCustBnam">گاہک / تفصیل</th>
                            <th style="width: 31%;" id="thAmtBnam">بنام رقم</th>
                            <th style="width: 6%;" class="col-action-th" id="thActionBnam">ایکشن</th>
                        </tr>
                    </thead>
                    <tbody id="bnam_tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- ⚡ تینوں ٹوٹل باکسز (ڈائنامک پوزیشن کے لیے شناختی ID موجود ہے) -->
        <div class="summary-box" id="mainSummaryTotalsBox">
            <div class="summary-item jama-side">
                <span class="dot dot-green"></span> <span id="lblTotalJama">ٹوٹل جمع کھاتے:</span>
                <div class="color-jama" id="total_jama_box">0</div>
            </div>
            <div class="summary-item cash-side">
                <span class="dot dot-bag"></span> <span id="lblNetCash">خالص کیش :</span>
                <div class="color-cash" id="net_cash">0</div>
            </div>
            <div class="summary-item bnam-side">
                <span class="dot dot-orange"></span> <span id="lblTotalBnam">ٹوٹل بنام کھاتے:</span>
                <div class="color-bnam" id="total_bnam_box">0</div>
            </div>
        </div>
    </div>

    <script>
        function applySavedTheme() {
            let savedTheme = localStorage.getItem('rohan_theme_mode') || 'dark';
            let themeMeta = document.querySelector('meta[name="theme-color"]');

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#f3f4f6');
            } else {
                document.body.classList.remove('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#080808');
            }
        }
        applySavedTheme();

        let activeBranchId = localStorage.getItem('active_branch_id') || 'branch_1';
        let activeBranchName = (localStorage.getItem('active_branch_name') || 'ڈرائی فروٹ ہاؤس').trim();
        let userRole = sessionStorage.getItem('rohan_user_role') || 'admin';

        // 🌐 برانچ کی زبان چیک کرنا
        let branchOverrides = JSON.parse(localStorage.getItem('rohan_branch_lang_overrides')) || {};
        let globalLang = localStorage.getItem('rohan_global_lang') || 'ur';
        let activeBranchLang = localStorage.getItem('active_branch_lang') || branchOverrides[activeBranchId] || globalLang;
        let isEn = (activeBranchLang === 'en');

        // ⚡ اوپر برانچ کا نام دو گنا چھوٹا سیٹ کرنا
        document.getElementById('headerBranchName').innerText = activeBranchName;

        // ⚙️ ہوم پیج کی ماسٹر کنفیگریشن حاصل کرنا
        let masterSettings = JSON.parse(localStorage.getItem(`rohan_branch_master_settings_${activeBranchId}`)) || {
            cols: {
                pcs: { visible: true, name: 'پیس' },
                weight: { visible: true, name: 'وزن' },
                rate: { visible: true, name: 'ریٹ' },
                amount: { name: 'کل رقم' },
                extra: { visible: false, name: 'اضافی کالم' }
            },
            summaryBoxPos: 'bottom'
        };

        let showPcs = !masterSettings.cols || masterSettings.cols.pcs.visible !== false;
        let pcsCustomName = (masterSettings.cols && masterSettings.cols.pcs && masterSettings.cols.pcs.name) ? masterSettings.cols.pcs.name : (isEn ? 'Carton' : 'کارٹن');
        let showWeight = !masterSettings.cols || masterSettings.cols.weight.visible !== false;
        let weightCustomName = (masterSettings.cols && masterSettings.cols.weight && masterSettings.cols.weight.name) ? masterSettings.cols.weight.name : (isEn ? 'Weight' : 'وزن');
        let amountCustomName = (masterSettings.cols && masterSettings.cols.amount && masterSettings.cols.amount.name) ? masterSettings.cols.amount.name : '';

        // 🎛️ تینوں باکسز کی پوزیشن لاگو کرنا (اوپر یا نیچے)
        function applyBoxPlacement() {
            let totalsBox = document.getElementById('mainSummaryTotalsBox');
            let tablesContainer = document.getElementById('summaryTablesContainer');
            let filterPanel = document.getElementById('summaryFilterPanel');

            if (masterSettings.summaryBoxPos === 'under_tables') {
                if (filterPanel && totalsBox) {
                    filterPanel.insertAdjacentElement('afterend', totalsBox);
                }
            } else {
                let container = document.getElementById('mainSummaryContainer');
                if (container && totalsBox) {
                    container.appendChild(totalsBox);
                }
            }
        }
        applyBoxPlacement();

        // 🌐 زبان اپلائی کرنا
        if (isEn) {
            document.body.classList.add('lang-en');
            document.documentElement.lang = 'en';
            document.title = `Cash Summary - ${activeBranchName}`;

            document.getElementById('summaryMainTitle').innerText = 'Cash Summary';
            document.getElementById('btnPrintSummary').innerText = '🖨️️ Print';
            document.getElementById('btnBackHome').innerText = '🔙 Back';

            document.getElementById('lblSearch').innerText = '🔎 Search Name, Account # or Amount:';
            document.getElementById('summarySearchInput').placeholder = '🔍 Type name, account # or amount...';
            document.getElementById('lblDateFilter').innerText = '📅 Filter by Date:';

            document.getElementById('titleTableJama').innerText = '🟢 Credit Accounts (Jama)';
            document.getElementById('titleTableBnam').innerText = '🟠 Debit Accounts (Bnam)';

            document.getElementById('thCustJama').innerText = 'Customer / Description';
            document.getElementById('thAmtJama').innerText = amountCustomName || 'Credit Amount';

            document.getElementById('thCustBnam').innerText = 'Customer / Description';
            document.getElementById('thAmtBnam').innerText = amountCustomName || 'Debit Amount';

            let actionText = userRole === 'owner' ? 'Contact' : 'Edit';
            document.getElementById('thActionJama').innerText = actionText;
            document.getElementById('thActionBnam').innerText = actionText;

            document.getElementById('lblTotalJama').innerText = 'Total Credit Accounts:';
            document.getElementById('lblNetCash').innerText = 'Net Cash Balance:';
            document.getElementById('lblTotalBnam').innerText = 'Total Debit Accounts:';
        } else {
            document.body.classList.remove('lang-en');
            document.documentElement.lang = 'ur';
            document.title = `روکڑ سمری - ${activeBranchName}`;

            document.getElementById('summaryMainTitle').innerText = 'روکڑ سمری';

            if (amountCustomName) {
                document.getElementById('thAmtJama').innerText = `${amountCustomName} (جمع)`;
                document.getElementById('thAmtBnam').innerText = `${amountCustomName} (بنام)`;
            }

            let actionText = userRole === 'owner' ? 'رابطہ' : 'ترمیم';
            document.getElementById('thActionJama').innerText = actionText;
            document.getElementById('thActionBnam').innerText = actionText;
        }

        // 🎨 برانچ کا کسٹم رنگ لاگو کرنا
        let savedBranchesConfig = localStorage.getItem('rohan_branches_custom_config_v2');
        if (savedBranchesConfig) {
            try {
                let branches = JSON.parse(savedBranchesConfig);
                let currentBranch = branches.find(b => b.id === activeBranchId);
                if (currentBranch && currentBranch.color1) {
                    let primaryColor = currentBranch.color1;
                    let container = document.getElementById('mainSummaryContainer');
                    container.style.borderColor = primaryColor;
                    container.style.boxShadow = `0 4px 18px ${primaryColor}35`;

                    let topH = document.getElementById('summaryTopHeader');
                    if (topH) topH.style.borderBottomColor = primaryColor;

                    let prBtn = document.getElementById('btnPrintSummary');
                    if (prBtn) prBtn.style.backgroundColor = primaryColor;

                    let searchInp = document.getElementById('summarySearchInput');
                    if (searchInp) {
                        searchInp.addEventListener('focus', function() { this.style.borderColor = primaryColor; });
                        searchInp.addEventListener('blur', function() { this.style.borderColor = '#333'; });
                    }
                }
            } catch(e){}
        }

        let savedDocTitle = document.title;

        function updatePrintMetaStamp() {
            let now = new Date();
            let d = String(now.getDate()).padStart(2, '0');
            let m = String(now.getMonth() + 1).padStart(2, '0');
            let y = now.getFullYear();
            
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            let timeStr = `${hours}:${minutes} ${ampm}`;

            let stampEl = document.getElementById('printMetaStamp');
            if (stampEl) {
                stampEl.innerHTML = `Date: ${d}/${m}/${y}<br>Time: ${timeStr}`;
            }
        }

        function triggerPrintWithMeta() {
            updatePrintMetaStamp();
            savedDocTitle = document.title;
            document.title = "";
            window.print();
            setTimeout(() => { document.title = savedDocTitle; }, 1000);
        }

        window.onbeforeprint = function() {
            updatePrintMetaStamp();
            savedDocTitle = document.title;
            document.title = "";
        };

        window.onafterprint = function() {
            document.title = savedDocTitle;
        };

        window.openCustomerWhatsApp = function(event, customerName) {
            event.stopPropagation();
            let detailsKey = activeBranchId + '_customer_details';
            let customerDetails = JSON.parse(localStorage.getItem(detailsKey)) || [];

            let custInfo = null;
            for (let i = customerDetails.length - 1; i >= 0; i--) {
                if (customerDetails[i].name && customerDetails[i].name.toLowerCase() === customerName.toLowerCase()) {
                    custInfo = customerDetails[i];
                    break;
                }
            }

            let rawPhone = custInfo && custInfo.phone ? custInfo.phone.trim() : '';

            if (!rawPhone || rawPhone === '-' || rawPhone === '0') {
                alert(isEn ? `⚠️ Mobile number not saved for "${customerName}"!` : `⚠️ گاہک "${customerName}" کا موبائل نمبر محفوظ نہیں ہے!`);
                return;
            }

            let cleanPhone = rawPhone.replace(/[^0-9]/g, '');
            if (cleanPhone.startsWith('03')) {
                cleanPhone = '92' + cleanPhone.substring(1);
            } else if (cleanPhone.startsWith('3')) {
                cleanPhone = '92' + cleanPhone;
            }

            let waUrl = `https://wa.me/${cleanPhone}`;
            window.open(waUrl, '_blank');
        };

        function loadSummaryData() {
            let customerKey = activeBranchId + '_customer_list';
            let detailsKey = activeBranchId + '_customer_details';
            let bnamRecordsKey = activeBranchId + '_bnam_records';

            let customers = JSON.parse(localStorage.getItem(customerKey));
            if (!customers || customers.length === 0) {
                customers = JSON.parse(localStorage.getItem('factory_customers')) || [];
            }

            let customerDetails = JSON.parse(localStorage.getItem(detailsKey)) || [];

            let bnamRecords = JSON.parse(localStorage.getItem(bnamRecordsKey));
            if (!bnamRecords || bnamRecords.length === 0) {
                bnamRecords = JSON.parse(localStorage.getItem('bnam_records')) || [];
            }

            let selectedDate = document.getElementById('summaryDateFilter').value;

            const jamaTbody = document.getElementById('jama_tbody');
            const bnamTbody = document.getElementById('bnam_tbody');
            
            jamaTbody.innerHTML = '';
            bnamTbody.innerHTML = '';

            let totalJamaAmount = 0, totalBnamAmount = 0;
            let jamaRowsCount = 0, bnamRowsCount = 0;

            if(customers.length === 0) {
                let noAccMsgJama = isEn ? 'No credit accounts exist!' : 'کوئی جمع کھاتہ موجود نہیں!';
                let noAccMsgBnam = isEn ? 'No debit accounts exist!' : 'کوئی بنام کھاتہ موجود نہیں!';
                jamaTbody.innerHTML = `<tr><td colspan="3" style="color:#999; padding: 15px;">${noAccMsgJama}</td></tr>`;
                bnamTbody.innerHTML = `<tr><td colspan="3" style="color:#999; padding: 15px;">${noAccMsgBnam}</td></tr>`;
                return;
            }

            customers.forEach(customerName => {
                let customerRecords = bnamRecords.filter(r => r.customerName === customerName);
                
                if (selectedDate) {
                    customerRecords = customerRecords.filter(record => record.date === selectedDate);
                }

                let runningBalance = 0;
                let totalJamaPcs = 0, totalBnamPcs = 0;
                let totalJamaWeight = 0, totalBnamWeight = 0;

                customerRecords.forEach(record => {
                    let amt = parseFloat(record.totalAmount) || 0;
                    let pcs = parseInt(record.pcs) || 0;
                    let wt = parseFloat(record.weight) || 0;

                    if (record.type === 'JAMA') {
                        runningBalance += amt; 
                        totalJamaPcs += pcs;
                        totalJamaWeight += wt;
                    } else {
                        runningBalance -= amt; 
                        totalBnamPcs += pcs;
                        totalBnamWeight += wt;
                    }
                });

                let netCartons = totalJamaPcs - totalBnamPcs;
                let netWeight = totalJamaWeight - totalBnamWeight;

                let custInfo = null;
                for (let i = customerDetails.length - 1; i >= 0; i--) {
                    if (customerDetails[i].name && customerDetails[i].name.toLowerCase() === customerName.toLowerCase()) {
                        custInfo = customerDetails[i];
                        break;
                    }
                }

                let accountNoText = custInfo && custInfo.accountNo ? custInfo.accountNo : '';

                let statsHtml = '';
                let hasCartons = (showPcs && netCartons !== 0);
                let hasWeight = (showWeight && Math.abs(netWeight) >= 0.001);

                if (hasCartons || hasWeight) {
                    let cartonPart = '';
                    if (hasCartons) {
                        let cColor = netCartons >= 0 ? 'color-jama' : 'color-bnam';
                        cartonPart = `<span class="stat-badge">${pcsCustomName}: <strong class="${cColor}">${Math.abs(netCartons)}</strong></span>`;
                    }

                    let weightPart = '';
                    if (hasWeight) {
                        let wColor = netWeight >= 0 ? 'color-jama' : 'color-bnam';
                        weightPart = `<span class="stat-badge">${weightCustomName}: <strong class="${wColor}">${Math.abs(netWeight).toFixed(2)}</strong></span>`;
                    }

                    statsHtml = `
                        <div class="customer-stats-subrow">
                            ${cartonPart}
                            ${weightPart}
                        </div>
                    `;
                }

                let tr = document.createElement('tr');
                tr.className = 'summary-row clickable-row';
                tr.setAttribute('data-customer-name', customerName.toLowerCase());
                tr.setAttribute('data-account-no', accountNoText.toString().toLowerCase());

                tr.addEventListener('click', function(e) {
                    if (e.target.closest('.btn-pen-tiny') || e.target.closest('.btn-wa-tiny')) return;
                    openLedger(customerName);
                });

                const officialWaIcon = `
                    <svg viewBox="0 0 48 48">
                        <rect width="48" height="48" rx="11" fill="#25D366"/>
                        <path fill="#FFFFFF" d="M24 10C16.3 10 10 16.3 10 24c0 2.7.8 5.2 2.2 7.4L10.5 38l6.8-1.7C19.4 37.4 21.6 38 24 38c7.7 0 14-6.3 14-14S31.7 10 24 10zm0 25.5c-2.1 0-4.1-.6-5.8-1.6l-.4-.2-4.3 1.1 1.2-4.2-.3-.5c-1.1-1.8-1.7-3.9-1.7-6.1 0-6.4 5.2-11.5 11.5-11.5s11.5 5.2 11.5 11.5-5.2 11.5-11.5 11.5zm6.3-8.6c-.3-.2-2-.9-2.3-1-.3-.1-.6-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-1-1.7-2-1.9-2.3-.2-.3 0-.5.2-.7.1-.1.3-.4.5-.6.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.8-1.9-1.1-2.6-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1 0 1.8 1.3 3.6 1.5 3.8.2.3 2.6 4 6.3 5.6.9.4 1.6.6 2.1.8.9.3 1.7.2 2.3.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.1-.3-.2-.6-.4z"/>
                    </svg>
                `;

                let actionBtnHtml = userRole === 'owner' 
                    ? `<span class="btn-wa-tiny" onclick="openCustomerWhatsApp(event, '${customerName}')" title="${isEn ? 'Contact on WhatsApp' : 'واٹس ایپ پر رابطہ کریں'}">${officialWaIcon}</span>`
                    : `<span class="btn-pen-tiny" onclick="editCustomerName(event, '${customerName}')" title="${isEn ? 'Edit Info' : 'معلومات تبدیل کریں'}">✏️</span>`;

                let khataPrefix = isEn ? 'Account No.' : 'کھاتہ نمبر';
                let khataBadgeHtml = accountNoText ? `<span class="khata-inline-badge">(${khataPrefix} ${accountNoText})</span>` : '';

                if (runningBalance > 0) {
                    totalJamaAmount += runningBalance;
                    jamaRowsCount++;

                    tr.innerHTML = `
                        <td class="text-right">
                            <div class="customer-inline-info">
                                <div class="customer-name-row">
                                    <strong class="customer-main-name">${customerName}</strong>
                                    ${khataBadgeHtml}
                                </div>
                                ${statsHtml}
                            </div>
                        </td>
                        <td class="color-jama text-amount-jama main-amount-text">${runningBalance.toLocaleString('en-US')}</td>
                        <td class="col-action">${actionBtnHtml}</td>
                    `;
                    jamaTbody.appendChild(tr);
                } 
                else if (runningBalance < 0) {
                    let finalAmount = Math.abs(runningBalance);
                    totalBnamAmount += finalAmount;
                    bnamRowsCount++;

                    tr.innerHTML = `
                        <td class="text-right">
                            <div class="customer-inline-info">
                                <div class="customer-name-row">
                                    <strong class="customer-main-name">${customerName}</strong>
                                    ${khataBadgeHtml}
                                </div>
                                ${statsHtml}
                            </div>
                        </td>
                        <td class="color-bnam text-amount-bnam main-amount-text">${finalAmount.toLocaleString('en-US')}</td>
                        <td class="col-action">${actionBtnHtml}</td>
                    `;
                    bnamTbody.appendChild(tr);
                } 
                else {
                    if (netCartons < 0 || netWeight < 0) {
                        bnamRowsCount++;
                        tr.innerHTML = `
                            <td class="text-right">
                                <div class="customer-inline-info">
                                    <div class="customer-name-row">
                                        <strong class="customer-main-name">${customerName}</strong>
                                        ${khataBadgeHtml}
                                    </div>
                                    ${statsHtml}
                                </div>
                            </td>
                            <td class="color-bnam text-amount-bnam main-amount-text">0</td>
                            <td class="col-action">${actionBtnHtml}</td>
                        `;
                        bnamTbody.appendChild(tr);
                    } else {
                        jamaRowsCount++;
                        tr.innerHTML = `
                            <td class="text-right">
                                <div class="customer-inline-info">
                                    <div class="customer-name-row">
                                        <strong class="customer-main-name">${customerName}</strong>
                                        ${khataBadgeHtml}
                                    </div>
                                    ${statsHtml}
                                </div>
                            </td>
                            <td class="color-jama text-amount-jama main-amount-text">0</td>
                            <td class="col-action">${actionBtnHtml}</td>
                        `;
                        jamaTbody.appendChild(tr);
                    }
                }
            });

            let noRecordMsg = isEn ? 'No records found!' : 'کوئی ریکارڈ نہیں ملا!';
            if(jamaRowsCount === 0) jamaTbody.innerHTML = `<tr class="no-data-row"><td colspan="3" style="color:#999; padding: 15px;">${noRecordMsg}</td></tr>`;
            if(bnamRowsCount === 0) bnamTbody.innerHTML = `<tr class="no-data-row"><td colspan="3" style="color:#999; padding: 15px;">${noRecordMsg}</td></tr>`;

            let netCash = totalJamaAmount - totalBnamAmount;

            document.getElementById('total_jama_box').innerText = totalJamaAmount.toLocaleString('en-US');
            document.getElementById('total_bnam_box').innerText = totalBnamAmount.toLocaleString('en-US');
            document.getElementById('net_cash').innerText = Math.abs(netCash).toLocaleString('en-US');
        }

        window.openLedger = function(customerName) {
            localStorage.setItem('active_ledger_customer', customerName);
            localStorage.setItem('ledger_back_target', './summary.html');
            window.location.href = './customer_ledger.html';
        };

        window.editCustomerName = function(event, customerName) {
            event.stopPropagation();
            if (userRole === 'owner') {
                alert(isEn ? "⚠️ You are not authorized to edit customer details!" : "⚠️ آپ کے پاس گاہک کا نام تبدیل کرنے کی اجازت نہیں ہے!");
                return;
            }
            localStorage.setItem('active_ledger_customer', customerName);
            window.location.href = './edit_customer.html';
        };

        document.getElementById('summarySearchInput').addEventListener('input', function() {
            const filterValue = this.value.toLowerCase().trim();
            const summaryRows = document.querySelectorAll('#jama_tbody tr, #bnam_tbody tr');

            summaryRows.forEach(row => {
                if(row.classList.contains('no-data-row')) return;

                let nameMatch = row.getAttribute('data-customer-name')?.includes(filterValue);
                let accountMatch = row.getAttribute('data-account-no')?.includes(filterValue);
                let textMatch = row.innerText.toLowerCase().replace(/,/g, '').includes(filterValue);

                if (nameMatch || accountMatch || textMatch) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        });

        document.addEventListener("DOMContentLoaded", loadSummaryData);
    </script>
</body>
</html>
