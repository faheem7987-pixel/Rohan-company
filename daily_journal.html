<!DOCTYPE html>
<html lang="ur">
<head>

<script>
    (function(document, window) {
        var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        
        if (standalone) {
            document.addEventListener('click', function(e) {
                var target = e.target;
                while (target && target.nodeName !== 'A' && target.nodeName !== 'HTML') {
                    target = target.parentNode;
                }
                
                if (target && target.nodeName === 'A') {
                    var href = target.getAttribute('href');
                    if (href && !href.startsWith('http') && !href.startsWith('javascript:') && href !== '#') {
                        e.preventDefault();
                        window.location.href = href;
                    }
                }
            }, true);
        }
    })(document, window);
</script>

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="apple-touch-icon-precomposed" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روزانہ کا روزنامچہ</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="روزنامچہ">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 12px 18px; 
            direction: rtl; 
            text-align: right; 
            background-color: #0d0d0d; 
            color: white; 
            min-height: 100vh; 
            width: 100%; 
            max-width: 100%; 
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        body.lang-en {
            direction: ltr !important;
            text-align: left !important;
        }

        .container { 
            width: 100%; 
            max-width: 100%; 
            margin: 0 auto; 
            background: #1a1a1a; 
            border: 1px solid #28a745; 
            padding: 14px 16px; 
            box-shadow: 0 4px 15px rgba(40,167,69,0.15); 
            border-radius: 10px; 
            transition: all 0.25s ease;
        }
        
        .top-header { 
            display: flex; 
            flex-flow: row wrap; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            padding-bottom: 8px; 
            border-bottom: 2px solid #28a745; 
            gap: 10px; 
        }
        .main-title { 
            font-size: clamp(18px, 2.4vw, 26px); 
            font-weight: bold; 
            color: #ffc107; 
            order: 2; 
            flex-grow: 1; 
            text-align: center; 
            margin: 0; 
        }
        .btn-header { 
            padding: 7px 16px; 
            font-size: clamp(13px, 1.3vw, 15px); 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 5px; 
            cursor: pointer; 
            border: none; 
            display: inline-block; 
            text-align: center; 
            white-space: nowrap; 
        }
        .btn-print { background-color: #28a745; color: white; order: 1; }
        .btn-print:hover { opacity: 0.9; }
        .btn-back { background-color: #007bff; color: white; order: 3; }
        .btn-back:hover { background-color: #0056b3; }

        .date-title { text-align: center; font-size: 15px; color: #ffc107; margin-bottom: 10px; font-weight: bold; }
        .date-input { padding: 6px 12px; font-size: 14.5px; background-color: #151515; border: 1px solid #333; color: white; border-radius: 6px; font-weight: bold; outline: none; transition: all 0.2s ease; }
        .date-input:focus { border-color: #28a745; }
        .print-date-display { display: none; }

        .search-wrapper { margin-bottom: 10px; width: 100%; }
        .search-input { width: 100%; padding: 9px 14px; background-color: #151515; border: 1px solid #333; border-radius: 6px; color: white; font-size: 14.5px; font-weight: bold; box-sizing: border-box; direction: rtl; text-align: right; transition: all 0.2s ease; height: 40px; }
        body.lang-en .search-input { direction: ltr !important; text-align: left !important; }
        .search-input:focus { border-color: #28a745; outline: none; box-shadow: 0 0 6px rgba(40,167,69,0.3); }

        .shared-scroll-wrapper { 
            width: 100%; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 6px; 
            background: #141414; 
            transition: all 0.25s ease;
        }

        .shared-inner-content { 
            min-width: 530px; 
            width: 100%; 
        }

        .journal-chart-box { 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between; 
            background: #151515; 
            color: white; 
            padding: 8px 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid #333; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.25); 
            gap: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            transition: all 0.25s ease; 
        }
        .dashboard-stat-card {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6px 10px;
            background: #1f1f1f;
            border-radius: 6px;
            border-right: 4px solid #28a745;
            text-align: right;
            box-sizing: border-box;
        }
        body.lang-en .dashboard-stat-card {
            border-right: none;
            border-left: 4px solid #28a745;
            text-align: left;
        }
        .dashboard-stat-card.bnam-card {
            border-right-color: #dc3545;
        }
        body.lang-en .dashboard-stat-card.bnam-card {
            border-left-color: #dc3545;
        }
        .stat-label {
            font-size: 12px;
            color: #bbb;
            font-weight: bold;
            margin-bottom: 3px;
            white-space: nowrap;
            display: block;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 900 !important;
            white-space: nowrap;
            display: block;
        }
        .stat-value.j-jama { color: #28a745; }
        .stat-value.j-bnam { color: #dc3545; }

        .chart-circle-wrapper { 
            flex: 0 0 52px; 
            height: 52px; 
            background: transparent; 
            padding: 2px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        table { width: 100%; border-collapse: collapse; text-align: center; background-color: #151515; table-layout: fixed; transition: all 0.25s ease; }
        th, td { 
            padding: 6px 2px; 
            text-align: center; 
            border: 1px solid #333; 
            font-size: 13.5px; 
            font-weight: bold; 
            vertical-align: middle;
            word-wrap: break-word;
        }

        th { background-color: #222; color: #ffc107; font-weight: bold; font-size: 13px; padding: 6px 2px; }
        
        .th-khata-head {
            font-size: 9.5px !important;
            padding: 6px 1px !important;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .th-pcs-head {
            font-size: 10.5px !important;
            padding: 6px 1px !important;
            letter-spacing: -0.2px;
        }

        .bg-title-jama { background-color: #1b5e20; color: white; }
        .bg-title-bnam { background-color: #7f1d1d; color: white; }
        .bg-title-k-jama { background-color: #ffb74d; color: black; }
        .bg-title-k-bnam { background-color: #d35400; color: white; }
        
        .row-old-balance { background-color: #1f1f1f; border: 1px dashed #444; }
        .text-right { text-align: right; padding-right: 8px; }
        body.lang-en .text-right { text-align: left; padding-left: 8px; padding-right: 2px; }
        
        .color-jama-text, .text-jama { color: #28a745 !important; font-weight: 900 !important; }
        .color-bnam-text, .text-bnam { color: #dc3545 !important; font-weight: 900 !important; }
        
        .journal-detail-text { color: #e0e0e0; font-weight: bold; }
        
        .row-today-total { background-color: #222; }
        .row-carton-record { background-color: #151515; color: white; border: 1px solid #333; }
        .row-final-balance { background-color: #1a1a1a; color: white; }
        .row-final-balance td.final-amount-cell { background-color: #151515; border: 2px solid #28a745; color: white; }
        .no-records { color: #888; padding: 14px; font-size: 14px; }

        body.light-theme { background-color: #f3f4f6; color: #111827; }
        body.light-theme .container { background: #ffffff; border-color: #28a745; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        body.light-theme .main-title { color: #b45309; }
        body.light-theme .date-title { color: #b45309; }
        body.light-theme .date-input { background-color: #f9fafb; color: #111827; border-color: #d1d5db; }
        body.light-theme .shared-scroll-wrapper { background: #ffffff; border-color: #e5e7eb; }
        body.light-theme .journal-chart-box { background: #ffffff; border-color: #e5e7eb; color: #111827; box-shadow: 0 3px 8px rgba(0,0,0,0.05); }
        body.light-theme .dashboard-stat-card { background: #f9fafb; }
        body.light-theme .stat-label { color: #4b5563; }
        body.light-theme .search-input { background-color: #f9fafb; color: #111827; border-color: #d1d5db; }
        body.light-theme table { background-color: #ffffff; }
        body.light-theme th, body.light-theme td { border-color: #e5e7eb; color: #111827; }
        body.light-theme th { background-color: #f3f4f6; color: #111827; }
        body.light-theme .color-jama-text, body.light-theme .text-jama, body.light-theme .stat-value.j-jama { color: #15803d !important; }
        body.light-theme .color-bnam-text, body.light-theme .text-bnam, body.light-theme .stat-value.j-bnam { color: #b91c1c !important; }
        body.light-theme .journal-detail-text { color: #111827 !important; }
        body.light-theme tr:hover { background-color: #f9fafb; }
        body.light-theme .row-old-balance { background-color: #f9fafb; border-color: #d1d5db; }
        body.light-theme .row-today-total { background-color: #f3f4f6; color: #111827; }
        body.light-theme .row-carton-record { background-color: #ffffff; color: #111827; border-color: #e5e7eb; }
        body.light-theme .row-final-balance { background-color: #f3f4f6; color: #111827; }
        body.light-theme .row-final-balance td.final-amount-cell { background-color: #ffffff; border-color: #28a745; }

        @media (max-width: 600px) {
            body { padding: 4px; padding-bottom: 12px; }
            .container { padding: 5px; border: none; box-shadow: none; background: #121212; }
            body.light-theme .container { background: #ffffff; }
            .top-header { flex-direction: row !important; justify-content: space-between !important; align-items: center !important; margin-bottom: 8px; padding-bottom: 6px; gap: 6px; }
            .main-title { font-size: 14px !important; }
            .btn-print, .btn-back { padding: 6px 12px !important; font-size: 12px !important; font-weight: 800 !important; border-radius: 6px !important; }
            .date-title { font-size: 11.5px; margin-bottom: 6px; }
            .date-input { padding: 4px 6px; font-size: 11.5px; }
            .search-wrapper { margin-bottom: 6px; }
            .search-input { padding: 5px 8px; font-size: 11px; height: 32px; }
            .journal-chart-box { padding: 5px 6px !important; gap: 4px !important; margin-bottom: 6px; width: 100% !important; box-sizing: border-box !important; }
            .dashboard-stat-card { padding: 4px 6px !important; border-right-width: 3px !important; min-width: 0 !important; flex: 1 1 0 !important; overflow: hidden !important; }
            body.lang-en .dashboard-stat-card { border-right-width: 0 !important; border-left-width: 3px !important; }
            .stat-label { font-size: 9.5px !important; letter-spacing: -0.2px !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
            .stat-value { font-size: 13.5px !important; font-weight: 900 !important; white-space: nowrap !important; }
            .chart-circle-wrapper { flex: 0 0 38px !important; height: 38px !important; }
            .shared-scroll-wrapper { padding: 3px; border-radius: 6px; }
            .shared-inner-content { min-width: 530px; width: 530px; } 
            table { font-size: 12px !important; width: 100% !important; }
            th, td { padding: 9px 2px !important; font-size: 12px !important; line-height: 1.5 !important; vertical-align: middle !important; }
            th { font-size: 11.5px !important; padding: 7px 2px !important; }
            .th-khata-head { font-size: 8.5px !important; padding: 7px 1px !important; }
            .th-pcs-head { font-size: 9.5px !important; padding: 7px 1px !important; }
            td.col-cust-name { line-height: 1.6 !important; padding-top: 8px !important; padding-bottom: 8px !important; }
            .stat-value, .color-bnam-text, .color-jama-text, .text-bnam, .text-jama { font-weight: 900 !important; }
        }

        @media print {
            @page { size: auto; margin: 8mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: transparent !important; background-image: none !important; box-shadow: none !important; text-shadow: none !important; }
            .btn-header, .journal-chart-box, .search-wrapper, .date-input { display: none !important; }
            .print-date-display { display: inline-block !important; font-size: 14px !important; color: #000000 !important; font-weight: bold !important; direction: ltr !important; }
            body { background: #ffffff !important; padding: 0 !important; width: 100% !important; color: #000000 !important; }
            .container, .shared-scroll-wrapper { border: none !important; box-shadow: none !important; padding: 0 !important; background: #ffffff !important; overflow: visible !important; }
            .shared-inner-content { min-width: 100% !important; width: 100% !important; }
            .date-title { color: #000000 !important; font-size: 15px !important; margin-bottom: 12px !important; display: block !important; }
            table { width: 100% !important; border-collapse: collapse !important; min-width: 100% !important; }
            thead { display: table-header-group !important; }
            tbody { display: table-row-group !important; }
            tr { page-break-inside: avoid !important; }
            th, td { border: 1px solid #000000 !important; padding: 4px 2px !important; font-size: 11px !important; color: #000000; }
            th { background-color: #f5f5f5 !important; color: #000000 !important; }
            .bg-title-jama { color: #1e7e34 !important; }
            .bg-title-bnam { color: #bd2130 !important; }
            .bg-title-k-jama { color: #d35400 !important; }
            .bg-title-k-bnam { color: #bd2130 !important; }
            .color-jama-text, .row-old-balance .text-jama { color: #1e7e34 !important; font-weight: 900 !important; }
            .color-bnam-text, .row-old-balance .text-bnam { color: #bd2130 !important; font-weight: 900 !important; }
            .journal-detail-text { color: #000000 !important; }
            .row-old-balance, .row-today-total, .row-carton-record, .row-final-balance { background: transparent !important; }
            .row-carton-record td { color: #000000 !important; font-weight: 900 !important; }
            .row-final-balance td { color: #000000 !important; font-weight: 900 !important; }
            .row-final-balance td.final-amount-cell { border: 1px solid #000000 !important; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainJournalContainer">
        <div class="top-header" id="topHeaderArea">
            <button onclick="window.print()" class="btn-header btn-print" id="btnPrintJournal">🖨️ پرنٹ کریں</button>
            <div class="main-title" id="journalMainTitle">روزانہ کا روزنامچہ</div>
            <a href="./home.html" class="btn-back btn-header" id="btnBackHome">🔙 واپس جائیں</a>
        </div>

        <div class="date-title">
            <span>Date: </span>
            <input type="date" class="date-input" id="journal_date" onchange="loadJournalData()">
            <span class="print-date-display" id="printDateText"></span>
        </div>

        <div class="search-wrapper">
            <input type="text" id="journalSearchInput" class="search-input" placeholder="🔍 روزنامچہ میں تلاش کریں (نام، تفصیل، وزن یا رقم لکھیں)...">
        </div>

        <div class="shared-scroll-wrapper">
            <div class="shared-inner-content">

                <!-- 📊 ڈیش بورڈ باکس -->
                <div class="journal-chart-box">
                    <div class="dashboard-stat-card">
                        <span class="stat-label" id="lblStatJama">🟢 کل وصولی (JAMA)</span>
                        <span id="infoJama" class="stat-value j-jama">0</span>
                    </div>

                    <div class="chart-circle-wrapper">
                        <canvas id="journalCircleChart"></canvas>
                    </div>

                    <div class="dashboard-stat-card bnam-card">
                        <span class="stat-label" id="lblStatBnam">🔴 کل ادائیگی (BNAM)</span>
                        <span id="infoBnam" class="stat-value j-bnam">0</span>
                    </div>
                </div>

                <!-- 💻 ٹیبل مع ڈائنامک ہیڈر کنٹرول -->
                <table id="journalTable">
                    <thead>
                        <tr id="journalHeaderRow">
                            <th class="th-khata-head" id="thAccNo" style="width: 6%;">کھاتہ نمبر</th>
                            <th id="thCustName" style="width: 17%;">کسٹمر نام</th>
                            <th id="thDetails" style="width: 17%;">تفصیل</th>
                            <!-- ⚡ اضافی کالم اگر فعال ہو -->
                            <th id="thExtra" style="width: 11%; display: none;">اضافی</th>
                            <th class="bg-title-k-bnam th-pcs-head" id="thPcsBnam" style="width: 6.5%;">پیس بنام</th>
                            <th class="bg-title-k-jama th-pcs-head" id="thPcsJama" style="width: 6.5%;">پیس جمع</th>
                            <th id="thWeight" style="width: 9%;">وزن</th>
                            <th id="thRate" style="width: 9%;">ریٹ</th>
                            <th class="bg-title-bnam" id="thBnam" style="width: 14%;">بنام</th>
                            <th class="bg-title-jama" id="thJama" style="width: 14%;">جمع</th>
                        </tr>
                    </thead>
                    <tbody id="journalTbody"></tbody>
                </table>

            </div>
        </div>
    </div>

    <script>
        function applySavedTheme() {
            let savedTheme = localStorage.getItem('rohan_theme_mode') || 'dark';
            let themeMeta = document.querySelector('meta[name="theme-color"]');

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#f3f4f6');
            } else {
                document.body.classList.remove('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#080808');
            }
        }
        applySavedTheme();

        let activeBranchId = localStorage.getItem('active_branch_id') || 'branch_1';
        let activeBranchName = (localStorage.getItem('active_branch_name') || 'ڈرائی فروٹ ہاؤس').trim();
        
        let branchOverrides = JSON.parse(localStorage.getItem('rohan_branch_lang_overrides')) || {};
        let globalLang = localStorage.getItem('rohan_global_lang') || 'ur';
        let activeBranchLang = localStorage.getItem('active_branch_lang') || branchOverrides[activeBranchId] || globalLang;
        let isEn = (activeBranchLang === 'en');

        // ⚙ ہوم پیج کی ماسٹر کنفیگریشن حاصل کرنا
        let masterSettings = JSON.parse(localStorage.getItem(`rohan_branch_master_settings_${activeBranchId}`)) || {
            cols: {
                pcs: { visible: true, name: 'پیس' },
                weight: { visible: true, name: 'وزن' },
                rate: { visible: true, name: 'ریٹ' },
                amount: { name: 'کل رقم' },
                extra: { visible: false, name: 'اضافی کالم' }
            }
        };

        let showExtra = masterSettings.cols && masterSettings.cols.extra && masterSettings.cols.extra.visible === true;
        let extraColName = (masterSettings.cols && masterSettings.cols.extra && masterSettings.cols.extra.name) ? masterSettings.cols.extra.name : (isEn ? 'Extra' : 'اضافی');
        let showPcs = !masterSettings.cols || masterSettings.cols.pcs.visible !== false;
        let pcsCustomName = (masterSettings.cols && masterSettings.cols.pcs && masterSettings.cols.pcs.name) ? masterSettings.cols.pcs.name : (isEn ? 'Pcs' : 'پیس');
        let showWeight = !masterSettings.cols || masterSettings.cols.weight.visible !== false;
        let weightCustomName = (masterSettings.cols && masterSettings.cols.weight && masterSettings.cols.weight.name) ? masterSettings.cols.weight.name : (isEn ? 'Weight' : 'وزن');
        let showRate = !masterSettings.cols || masterSettings.cols.rate.visible !== false;
        let rateCustomName = (masterSettings.cols && masterSettings.cols.rate && masterSettings.cols.rate.name) ? masterSettings.cols.rate.name : (isEn ? 'Rate' : 'ریٹ');

        // 🌐 زبان و ہیڈرز سیٹ کرنا
        if (isEn) {
            document.body.classList.add('lang-en');
            document.documentElement.lang = 'en';
            document.title = `Daily Journal - ${activeBranchName}`;

            document.getElementById('btnPrintJournal').innerText = '🖨️ Print';
            document.getElementById('btnBackHome').innerText = '🔙 Back';
            document.getElementById('journalSearchInput').placeholder = '🔍 Search journal (Name, Details, Weight, Amount)...';

            document.getElementById('lblStatJama').innerText = '🟢 Total Received (Cr)';
            document.getElementById('lblStatBnam').innerText = '🔴 Total Paid (Dr)';

            document.getElementById('thAccNo').innerText = 'Acc No';
            document.getElementById('thCustName').innerText = 'Customer Name';
            document.getElementById('thDetails').innerText = 'Details';
            document.getElementById('thExtra').innerText = extraColName;
            document.getElementById('thPcsBnam').innerText = `${pcsCustomName} Dr`;
            document.getElementById('thPcsJama').innerText = `${pcsCustomName} Cr`;
            document.getElementById('thWeight').innerText = weightCustomName;
            document.getElementById('thRate').innerText = rateCustomName;
            document.getElementById('thBnam').innerText = 'Debit';
            document.getElementById('thJama').innerText = 'Credit';
        } else {
            document.body.classList.remove('lang-en');
            document.documentElement.lang = 'ur';
            document.title = `روزنامچہ - ${activeBranchName}`;

            document.getElementById('thExtra').innerText = extraColName;
            document.getElementById('thPcsBnam').innerText = `${pcsCustomName} بنام`;
            document.getElementById('thPcsJama').innerText = `${pcsCustomName} جمع`;
            document.getElementById('thWeight').innerText = weightCustomName;
            document.getElementById('thRate').innerText = rateCustomName;
        }

        // 🎛️ کالمز کی مرئیت (Visibility) سیٹ کرنا
        document.getElementById('thExtra').style.display = showExtra ? '' : 'none';
        document.getElementById('thPcsBnam').style.display = showPcs ? '' : 'none';
        document.getElementById('thPcsJama').style.display = showPcs ? '' : 'none';
        document.getElementById('thWeight').style.display = showWeight ? '' : 'none';
        document.getElementById('thRate').style.display = showRate ? '' : 'none';

        // کالمز کی کل تعداد شمار کرنا (کولسپین کے لیے)
        function getTotalVisibleCols() {
            let count = 5; // AccNo, CustName, Details, Debit, Credit
            if (showExtra) count++;
            if (showPcs) count += 2; // Pcs Bnam, Pcs Jama
            if (showWeight) count++;
            if (showRate) count++;
            return count;
        }

        function getLeftSpanCols() {
            let count = 3; // AccNo, CustName, Details
            if (showExtra) count++;
            if (showPcs) count += 2;
            if (showWeight) count++;
            if (showRate) count++;
            return count;
        }

        // 🎨 برانچ کا کسٹم رنگ لاگو کرنا
        let savedBranchesConfig = localStorage.getItem('rohan_branches_custom_config_v2');
        if (savedBranchesConfig) {
            try {
                let branches = JSON.parse(savedBranchesConfig);
                let currentBranch = branches.find(b => b.id === activeBranchId);
                if (currentBranch && currentBranch.color1) {
                    let primaryColor = currentBranch.color1;
                    let container = document.getElementById('mainJournalContainer');
                    container.style.borderColor = primaryColor;
                    container.style.boxShadow = `0 4px 18px ${primaryColor}35`;

                    let topH = document.getElementById('topHeaderArea');
                    if (topH) topH.style.borderBottomColor = primaryColor;

                    let prBtn = document.getElementById('btnPrintJournal');
                    if (prBtn) prBtn.style.backgroundColor = primaryColor;
                }
            } catch(e){}
        }

        document.getElementById('journal_date').value = new Date().toISOString().substring(0, 10);
        let myChart = null;

        function loadJournalData() {
            const selectedDate = document.getElementById('journal_date').value;
            
            if (selectedDate) {
                let parts = selectedDate.split('-');
                if (parts.length === 3) {
                    document.getElementById('printDateText').innerText = `${parts[2]}/${parts[1]}/${parts[0]}`;
                } else {
                    document.getElementById('printDateText').innerText = selectedDate;
                }
            }

            const tbody = document.getElementById('journalTbody');
            tbody.innerHTML = '';

            let mainTitleText = isEn ? `Daily Journal - ${activeBranchName}` : `روزنامچہ - ${activeBranchName}`;
            document.getElementById('journalMainTitle').innerText = mainTitleText;

            let customerKey = activeBranchId + '_customer_list';
            let detailsKey = activeBranchId + '_customer_details';
            let bnamRecordsKey = activeBranchId + '_bnam_records';

            let activeCustomers = JSON.parse(localStorage.getItem(customerKey));
            if (!activeCustomers || activeCustomers.length === 0) {
                activeCustomers = JSON.parse(localStorage.getItem('factory_customers')) || [];
            }

            let customerDetails = JSON.parse(localStorage.getItem(detailsKey)) || [];

            let bnamRecords = JSON.parse(localStorage.getItem(bnamRecordsKey));
            if (!bnamRecords || bnamRecords.length === 0) {
                bnamRecords = JSON.parse(localStorage.getItem('bnam_records')) || [];
            }
            
            let openingCartons = 0;
            let openingAmount = 0; 

            bnamRecords.forEach(r => {
                if (activeCustomers.includes(r.customerName) && r.date < selectedDate) {
                    let amt = parseFloat(r.totalAmount) || 0;
                    let pcs = parseInt(r.pcs) || 0;
                    if (r.type === 'JAMA') {
                        openingAmount += amt;
                        openingCartons += pcs;
                    } else {
                        openingAmount -= amt;
                        openingCartons -= pcs;
                    }
                }
            });

            let activeEntries = bnamRecords.filter(r => r.date === selectedDate && activeCustomers.includes(r.customerName));

            let oldBalLabel = isEn ? "Previous Balance" : "پرانا حساب";
            let totalCols = getTotalVisibleCols();
            let leftCols = getLeftSpanCols();

            // پرانا حساب رو
            let oldRow = document.createElement('tr');
            oldRow.className = 'row-old-balance static-row';
            oldRow.innerHTML = `
                <td>-</td>
                <td>${oldBalLabel}</td>
                <td>-</td>
                ${showExtra ? '<td>-</td>' : ''}
                ${showPcs ? `<td class="text-bnam">${openingCartons < 0 ? Math.abs(openingCartons) : '-'}</td><td class="text-jama">${openingCartons >= 0 ? openingCartons : '-'}</td>` : ''}
                ${showWeight ? '<td>-</td>' : ''}
                ${showRate ? '<td>-</td>' : ''}
                <td class="text-bnam">${openingAmount < 0 ? Math.abs(openingAmount).toLocaleString('en-US') : '-'}</td>
                <td class="text-jama">${openingAmount >= 0 ? openingAmount.toLocaleString('en-US') : '-'}</td>
            `;
            tbody.appendChild(oldRow);

            let todayBnamCash = 0, todayJamaCash = 0;
            let todayBnamCartons = 0, todayJamaCartons = 0;

            if (activeEntries.length === 0) {
                let emptyMsg = isEn ? "❌ No entries recorded for this selected date!" : "❌ منتخب کردہ تاریخ میں ابھی کوئی انٹری موجود نہیں ہے!";
                let emptyRow = document.createElement('tr');
                emptyRow.className = 'journal-data-row';
                emptyRow.innerHTML = `<td colspan="${totalCols}" class="no-records">${emptyMsg}</td>`;
                tbody.appendChild(emptyRow);
            } else {
                activeEntries.forEach(item => {
                    let amt = parseFloat(item.totalAmount) || 0;
                    let pcs = parseInt(item.pcs) || 0;
                    let weight = parseFloat(item.weight) || 0;
                    let rate = parseFloat(item.rate) || 0;
                    let extraVal = item.extra || "-";
                    
                    let isBnam = (item.type === 'BNAM' || item.type !== 'JAMA'); 

                    let pcsBnam = "-", pcsJama = "-";
                    let cashBnam = "-", cashJama = "-";

                    if (isBnam) {
                        pcsBnam = pcs > 0 ? pcs : "-";
                        cashBnam = amt;
                        todayBnamCash += amt;
                        todayBnamCartons += pcs;
                    } else {
                        pcsJama = pcs > 0 ? pcs : "-";
                        cashJama = amt;
                        todayJamaCash += amt;
                        todayJamaCartons += pcs;
                    }

                    let custInfo = customerDetails.find(c => c.name.toLowerCase() === item.customerName.toLowerCase());
                    let accountNoText = custInfo && custInfo.accountNo ? custInfo.accountNo : '-';

                    let tr = document.createElement('tr');
                    tr.className = 'journal-data-row';
                    tr.innerHTML = `
                        <td>${accountNoText}</td>
                        <td class="col-cust-name"><strong>${item.customerName}</strong></td>
                        <td class="text-right journal-detail-text">${item.details || "-"}</td>
                        ${showExtra ? `<td class="journal-detail-text">${extraVal}</td>` : ''}
                        ${showPcs ? `<td class="color-bnam-text">${pcsBnam}</td><td class="color-jama-text">${pcsJama}</td>` : ''}
                        ${showWeight ? `<td>${weight > 0 ? weight : "-"}</td>` : ''}
                        ${showRate ? `<td>${rate > 0 ? rate : "-"}</td>` : ''}
                        <td class="color-bnam-text">${cashBnam > 0 ? cashBnam.toLocaleString('en-US') : "-"}</td>
                        <td class="color-jama-text">${cashJama > 0 ? cashJama.toLocaleString('en-US') : "-"}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            let todayTotalLabel = isEn ? "Today's Total" : "آج کا ٹوٹل";

            // آج کا ٹوٹل رو
            let totalRow = document.createElement('tr');
            totalRow.className = 'row-today-total static-row';
            totalRow.innerHTML = `
                <td>-</td>
                <td>${todayTotalLabel}</td>
                <td>-</td>
                ${showExtra ? '<td>-</td>' : ''}
                ${showPcs ? `<td>-</td><td>-</td>` : ''}
                ${showWeight ? '<td>-</td>' : ''}
                ${showRate ? '<td>-</td>' : ''}
                <td class="color-bnam-text">${todayBnamCash.toLocaleString('en-US')}</td>
                <td class="color-jama-text">${todayJamaCash.toLocaleString('en-US')}</td>
            `;
            tbody.appendChild(totalRow);

            let finalCartons = openingCartons + (todayJamaCartons - todayBnamCartons);
            let finalAmount = openingAmount + (todayJamaCash - todayBnamCash);

            let cartonRecLabel = isEn ? `${pcsCustomName} Record` : `${pcsCustomName} ریکارڈ`;
            let balRecLabel = isEn ? "Balance Record" : "بیلنس ریکارڈ";

            // ⚡ کارٹن/پیس ریکارڈ رو
            if (showPcs) {
                let cartonRow = document.createElement('tr');
                cartonRow.className = 'row-carton-record static-row';
                cartonRow.innerHTML = `
                    <td colspan="${leftCols}" class="text-right" style="color: #ffc107 !important; font-weight: bold; font-size: 14.5px;">${cartonRecLabel}</td>
                    <td colspan="2">
                        <span style="color: ${finalCartons >= 0 ? '#28a745' : '#dc3545'}; font-weight: 900; font-size: 15px;">
                            ${Math.abs(finalCartons)}
                        </span>
                    </td>
                `;
                tbody.appendChild(cartonRow);
            }

            // فائنل بیلنس رو
            let finalRow = document.createElement('tr');
            finalRow.className = 'row-final-balance static-row';
            finalRow.innerHTML = `
                <td colspan="${leftCols}" class="text-right" style="color: #ffc107 !important; font-weight: bold; font-size: 14.5px;">${balRecLabel}</td>
                <td colspan="2" class="final-amount-cell">
                    <span class="${finalAmount >= 0 ? 'color-jama-text' : 'color-bnam-text'}" style="font-size: 15px; font-weight: 900;">
                        ${Math.abs(finalAmount).toLocaleString('en-US')}
                    </span>
                </td>
            `;
            tbody.appendChild(finalRow);

            document.getElementById('infoJama').innerText = todayJamaCash.toLocaleString('en-US');
            document.getElementById('infoBnam').innerText = todayBnamCash.toLocaleString('en-US');

            updateChart(todayJamaCash, todayBnamCash);
        }

        function updateChart(jama, bnam) {
            const ctx = document.getElementById('journalCircleChart').getContext('2d');
            const chartData = (jama === 0 && bnam === 0) ? [1, 1] : [jama, bnam];
            
            let isLight = localStorage.getItem('rohan_theme_mode') === 'light';
            let emptyColor1 = isLight ? '#e5e7eb' : '#333';
            let emptyColor2 = isLight ? '#d1d5db' : '#444';
            const chartColors = (jama === 0 && bnam === 0) ? [emptyColor1, emptyColor2] : ['#28a745', '#dc3545'];

            if (myChart) myChart.destroy();

            let chartLabels = isEn ? ['Credit (Cr)', 'Debit (Dr)'] : ['جمع', 'بنام'];

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: { legend: { display: false }, tooltip: { enabled: (jama > 0 || bnam > 0) } }
                }
            });
        }

        document.getElementById('journalSearchInput').addEventListener('input', function() {
            let filterValue = this.value.toLowerCase().replace(/,/g, '').trim();
            let tbody = document.getElementById('journalTbody');
            let oldBalanceRow = tbody.querySelector('.row-old-balance');
            let dataRows = tbody.querySelectorAll('.journal-data-row');

            dataRows.forEach(row => {
                if (filterValue === "") {
                    row.style.display = "";
                } else {
                    let rowText = row.innerText.toLowerCase().replace(/,/g, '');
                    if (rowText.includes(filterValue)) {
                        row.style.display = "";
                        if (oldBalanceRow) {
                            oldBalanceRow.insertAdjacentElement('afterend', row);
                        }
                    } else {
                        row.style.display = "none";
                    }
                }
            });
        });

        document.addEventListener("DOMContentLoaded", loadJournalData);
    </script>
</body>
</html>
