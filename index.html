<!DOCTYPE html>
<html lang="ur">
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unit Business Group">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080808">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">

<script>
    (function(document, window) {
        var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        
        if (standalone) {
            document.addEventListener('click', function(e) {
                var target = e.target;
                while (target && target.nodeName !== 'A' && target.nodeName !== 'HTML') {
                    target = target.parentNode;
                }
                
                if (target && target.nodeName === 'A') {
                    var href = target.getAttribute('href');
                    if (href && !href.startsWith('http') && !href.startsWith('javascript:') && href !== '#') {
                        e.preventDefault();
                        window.location.href = href;
                    }
                }
            }, true);
        }
    })(document, window);
</script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="apple-touch-icon-precomposed" href="logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            direction: rtl; 
            background-color: #0d0d0d; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            transition: background-color 0.25s ease, color 0.25s ease;
            position: relative;
        }
        
        .theme-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4af37;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: all 0.25s ease;
            z-index: 1000;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.08);
            border-color: #d4af37;
        }

        .login-container { 
            background: #161616; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #444; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            text-align: center; 
            transition: all 0.25s ease;
        }
        
        .company-logo { width: 110px; height: auto; margin-bottom: 15px; object-fit: contain; }
        
        .login-title { 
            font-size: clamp(24px, 3.5vw, 32px); 
            font-weight: bold; 
            color: #d4af37; 
            margin-bottom: 5px; 
            letter-spacing: 1.5px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .login-subtitle { 
            font-size: clamp(14px, 2vw, 17px); 
            color: #f3e5ab; 
            margin-bottom: 25px; 
            letter-spacing: 3px; 
            font-weight: bold; 
        }
        .input-group { margin-bottom: 18px; text-align: right; }
        .input-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; font-size: 16px; outline: none; text-align: center; transition: all 0.2s ease; }
        .input-group input:focus { border-color: #d4af37; }
        
        .btn-login { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); 
            border: none; 
            border-radius: 6px; 
            color: #000; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .btn-login:hover { 
            background: linear-gradient(135deg, #f5d77f 0%, #c59b27 100%); 
            color: #000; 
        }
        .btn-login:active { transform: scale(0.98); }
        .error-message { color: #ff6b6b; font-size: 14px; margin-top: 12px; display: none; font-weight: bold; }

        body.light-theme {
            background-color: #f3f4f6;
            color: #111827;
        }
        body.light-theme .theme-toggle-btn {
            background: #ffffff;
            border-color: #d1d5db;
            color: #aa7c11;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body.light-theme .login-container {
            background: #ffffff;
            border-color: #e5e7eb;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        body.light-theme .login-title {
            color: #aa7c11;
        }
        body.light-theme .login-subtitle {
            color: #8c6407;
        }
        body.light-theme .input-group label {
            color: #374151;
        }
        body.light-theme .input-group input {
            background: #f9fafb;
            border-color: #d1d5db;
            color: #111827;
        }
        body.light-theme .input-group input:focus {
            border-color: #aa7c11;
            box-shadow: 0 0 0 3px rgba(170, 124, 17, 0.15);
        }
        body.light-theme .btn-login {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #ffffff;
        }
        body.light-theme .btn-login:hover {
            background: linear-gradient(135deg, #aa7c11 0%, #8c6407 100%);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تھیم تبدیل کریں">🌙</button>

    <div class="login-container">
        <img src="logo.png" alt="Unit Business Group Logo" class="company-logo">
        <div class="login-title">UNIT BUSINESS</div>
        <div class="login-subtitle">GROUP</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">یوزر نیم (User Name):</label>
                <input type="text" id="username" placeholder="یوزر نیم درج کریں" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">سیکیورٹی پاس ورڈ (Password):</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login">سسٹم میں داخل ہوں</button>
            <div id="errorMsg" class="error-message">❌ یوزر نیم یا پاس ورڈ درست نہیں ہے!</div>
        </form>
    </div>

    <script>
        function applySavedTheme() {
            let savedTheme = localStorage.getItem('rohan_theme_mode') || 'dark';
            let themeMeta = document.querySelector('meta[name="theme-color"]');
            let toggleBtn = document.getElementById('themeToggleBtn');

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                if (toggleBtn) toggleBtn.innerText = '☀️';
                if (themeMeta) themeMeta.setAttribute('content', '#f3f4f6');
            } else {
                document.body.classList.remove('light-theme');
                if (toggleBtn) toggleBtn.innerText = '🌙';
                if (themeMeta) themeMeta.setAttribute('content', '#080808');
            }
        }

        function toggleTheme() {
            let currentTheme = localStorage.getItem('rohan_theme_mode') || 'dark';
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('rohan_theme_mode', newTheme);
            applySavedTheme();
        }

        applySavedTheme();

        sessionStorage.removeItem('rohan_session_active');
        sessionStorage.removeItem('rohan_user_role');

        function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if (usernameInput === 'rohan' && passwordInput === '5638') {
                errorMsg.style.display = 'none';
                sessionStorage.setItem('rohan_session_active', 'true');
                sessionStorage.setItem('rohan_user_role', 'admin');
                window.location.href = './branches.html'; 
            } 
            else if (usernameInput.toLowerCase() === 'owner' && passwordInput === '2030') {
                errorMsg.style.display = 'none';
                sessionStorage.setItem('rohan_session_active', 'true');
                sessionStorage.setItem('rohan_user_role', 'owner');
                window.location.href = './branches.html'; 
            } 
            else {
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
